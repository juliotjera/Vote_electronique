<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f4d">
<title>Vote électronique</title>
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        padding: 24px; text-align: center; color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(150deg, #0b1f4d 0%, #132a63 55%, #1e3a8a 100%);
    }
    h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
    p { margin: 0; max-width: 30ch; line-height: 1.5; color: rgba(255,255,255,.75); }
    .barre { width: 180px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
    .barre span { display: block; width: 40%; height: 100%; border-radius: 4px; background: #93c5fd; animation: aller 1.3s ease-in-out infinite; }
    @keyframes aller { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    button {
        min-height: 48px; padding: 0 28px; border: 0; border-radius: 8px; font: inherit; font-weight: 600;
        color: #fff; background: linear-gradient(180deg, #2563eb, #1d4ed8);
    }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { .barre span { animation: none; width: 100%; } }
</style>
</head>
<body>
    <svg viewBox="0 0 36 36" width="76" height="76" aria-hidden="true">
        <defs><linearGradient id="d" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e40af"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs>
        <rect width="36" height="36" rx="9" fill="url(#d)"/>
        <rect x="11.5" y="6.5" width="13" height="13.5" rx="2" fill="#fff"/>
        <path d="M14.6 13.2l2.4 2.4 4.4-4.8" fill="none" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M7.5 21.5h21v6a2.5 2.5 0 0 1-2.5 2.5H10a2.5 2.5 0 0 1-2.5-2.5z" fill="#fff"/>
    </svg>
    <h1>Vote électronique</h1>

    <div id="attente" role="status">
        <p>Connexion au serveur… Au premier lancement de la journée, cela peut prendre jusqu’à une minute.</p>
        <div class="barre" style="margin: 18px auto 0" aria-hidden="true"><span></span></div>
    </div>

    <div id="erreur" hidden role="alert">
        <p id="erreur-texte">Pas de connexion Internet. Vérifiez le Wi-Fi ou les données mobiles, puis réessayez.</p>
        <button type="button" id="reessayer" style="margin-top: 18px">Réessayer</button>
    </div>

<script>
    // Le site est rendu par le serveur (Laravel) : l'application l'ouvre une fois qu'il répond.
    // L'hébergement gratuit endort le serveur après 15 minutes d'inactivité : on patiente le temps du réveil.
    const SITE = 'https://vote-electronique.onrender.com';
    const attente = document.getElementById('attente');
    const erreur = document.getElementById('erreur');

    function echec(message) {
        document.getElementById('erreur-texte').textContent = message;
        attente.hidden = true;
        erreur.hidden = false;
    }

    async function ouvrir() {
        erreur.hidden = true;
        attente.hidden = false;
        if (!navigator.onLine) {
            return echec('Pas de connexion Internet. Vérifiez le Wi-Fi ou les données mobiles, puis réessayez.');
        }
        const delai = new AbortController();
        const minuteur = setTimeout(() => delai.abort(), 90000);
        try {
            // réponse opaque (autre origine) : seule compte la réussite de la requête
            await fetch(SITE + '/up', { mode: 'no-cors', cache: 'no-store', signal: delai.signal });
            location.replace(SITE + '/');
        } catch (e) {
            echec(navigator.onLine
                ? 'Le serveur ne répond pas pour l’instant. Réessayez dans un moment.'
                : 'Pas de connexion Internet. Vérifiez le Wi-Fi ou les données mobiles, puis réessayez.');
        } finally {
            clearTimeout(minuteur);
        }
    }

    document.getElementById('reessayer').addEventListener('click', ouvrir);
    ouvrir();
</script>
</body>
</html>
