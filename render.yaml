# Déploiement Render (Blueprint) : un service web Docker ; base PostgreSQL chez Neon (gratuit).
# Render > New > Blueprint > choisir ce dépôt, puis saisir les valeurs marquées « sync: false ».
services:
  - type: web
    name: vote-electronique
    runtime: docker
    plan: free
    region: frankfurt          # la plus proche de Madagascar parmi les régions de Render
    healthCheckPath: /up
    autoDeploy: true           # chaque « git push » sur main redéploie
    envVars:
      - key: APP_NAME
        value: Vote électronique
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY           # php artisan key:generate --show (valeur « base64:… »)
        sync: false
      - key: APP_URL
        value: https://vote-electronique.onrender.com
      - key: APP_LOCALE
        value: fr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL            # chaîne de connexion Neon (…?sslmode=require) : jamais dans le dépôt
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      # envoi des codes de connexion et des avis (Brevo, Resend… en SMTP)
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Vote électronique
      # site de démonstration : boutons « Essayer sans compte » et données fictives recréées quand le vote de démo est clos.
      # Pour de vrais votes : COMPTES_DEMO=false et DEMO_REINITIALISATION=false.
      - key: COMPTES_DEMO
        value: "true"
      - key: DEMO_REINITIALISATION
        value: "true"
